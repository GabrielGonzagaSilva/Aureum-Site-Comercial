name: Prepare Figma Reference Assets

on:
  push:
    paths:
      - '.github/workflows/prepare-figma-assets.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact website image assets
        run: |
          mkdir -p figma-reference-assets
          npm install puppeteer-core sharp --no-save
          CHROME="$(which google-chrome || which chromium-browser || which chromium)"
          export CHROME
          cat > capture-images.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import sharp from 'sharp';
          const browser = await puppeteer.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-setuid-sandbox']});
          const page = await browser.newPage();
          await page.setViewport({width:1440,height:1000,deviceScaleFactor:1});
          async function shot(url, selector, path){
            await page.goto(url,{waitUntil:'networkidle2',timeout:60000});
            const el=await page.$(selector);
            if(!el) throw new Error('Missing selector '+selector+' on '+url);
            const png=await el.screenshot({type:'png'});
            await sharp(png).resize({width:700,withoutEnlargement:true}).jpeg({quality:48,mozjpeg:true}).toFile(path);
          }
          const base='https://gabrielgonzagasilva.github.io/Aureum-Site-Comercial/';
          await shot(base,'.hero-image img','figma-reference-assets/hero.jpg');
          await shot(base,'.editorial-photo img','figma-reference-assets/editorial.jpg');
          await shot(base,'.private-image img','figma-reference-assets/private.jpg');
          await shot(base,'.dest-card:nth-child(1) img','figma-reference-assets/portugal.jpg');
          await shot(base,'.dest-card:nth-child(2) img','figma-reference-assets/espanha.jpg');
          await shot(base,'.dest-card:nth-child(3) img','figma-reference-assets/australia.jpg');
          await shot(base,'.dest-card:nth-child(4) img','figma-reference-assets/brasil.jpg');
          await browser.close();
          EOF
          node capture-images.mjs
          rm capture-images.mjs
          rm -f figma-reference-assets/*.b64
          for f in figma-reference-assets/*.jpg; do base64 -w 0 "$f" > "$f.b64"; done
      - name: Commit reference assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figma-reference-assets
          git diff --cached --quiet && exit 0
          git commit -m "optimize Figma reference image assets"
          git push
