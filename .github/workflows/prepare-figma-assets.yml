name: Prepare Figma Reference Assets

on:
  push:
    paths:
      - '.github/workflows/prepare-figma-assets.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Aureum visual references
        run: |
          mkdir -p figma-reference-assets/source
          npm install sharp --no-save
          curl -L --fail --retry 3 "https://images.unsplash.com/photo-1665242014432-fe7d2ae8bdc5?auto=format&fit=crop&q=82&w=1800" -o figma-reference-assets/source/hero.jpg
          curl -L --fail --retry 3 "https://images.unsplash.com/photo-1668367274736-a1316e367e00?auto=format&fit=crop&q=82&w=1800" -o figma-reference-assets/source/editorial.jpg
          curl -L --fail --retry 3 "https://images.unsplash.com/photo-1544740915-448e8ff02e67?auto=format&fit=crop&q=84&w=1600" -o figma-reference-assets/source/private.jpg
          curl -L --fail --retry 3 "https://images.unsplash.com/photo-1686824580969-08bef47ac2e8?auto=format&fit=crop&q=75&w=1600" -o figma-reference-assets/source/portugal.jpg
          curl -L --fail --retry 3 "https://images.unsplash.com/photo-1594719072279-4cef70e118f0?auto=format&fit=crop&q=75&w=1600" -o figma-reference-assets/source/espanha.jpg
          curl -L --fail --retry 3 "https://housingallaustralians.org.au/wp-content/uploads/2025/04/dan-freeman-7Zb7kUyQg1E-unsplash-scaled-1.jpg" -o figma-reference-assets/source/australia.jpg
          curl -L --fail --retry 3 "https://pontospravoar.com/wp-content/uploads/2025/02/filipe-freitas-rm9uMJP8o18-unsplash.png" -o figma-reference-assets/source/brasil.png
          cat > optimize.mjs <<'EOF'
          import sharp from 'sharp';
          import fs from 'fs';
          const files=[['hero','jpg'],['editorial','jpg'],['private','jpg'],['portugal','jpg'],['espanha','jpg'],['australia','jpg'],['brasil','png']];
          for(const [name,ext] of files){
            await sharp('figma-reference-assets/source/'+name+'.'+ext).resize({width:720,withoutEnlargement:true}).jpeg({quality:52,mozjpeg:true}).toFile('figma-reference-assets/'+name+'.jpg');
          }
          EOF
          node optimize.mjs
          rm optimize.mjs
          rm -rf figma-reference-assets/source
          rm -f figma-reference-assets/*.b64
          for f in figma-reference-assets/*.jpg; do base64 -w 0 "$f" > "$f.b64"; done
      - name: Commit reference assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figma-reference-assets
          git diff --cached --quiet && exit 0
          git commit -m "finalize Figma reference image assets"
          git push
